<!doctype html>
<html lang="id">
  <head>
    <title>Suit</title>
    <link rel="stylesheet" href="../bootstrap.css" />
    <link rel="stylesheet" href="../aos.css" />
    <link rel="stylesheet" href="../animate.css" />
    <script src="../bootstrap.js" defer></script>
    <script src="../aos.js"></script>
    <script src="script.js" defer></script>
    <style>
      @font-face {
        font-family: "web";
        src: url(../../../alat-bantu/fonts/JetBrains_Mono/static/JetBrainsMono-Regular.ttf);
      }
      * {
        font-family: web;
      }
      body {
        background-image: url(../edited-photo.jpg);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        min-height: 100vh;
        min-width: 100%;
      }
      .card-img-top {
        height: 200px;
        object-fit: cover;
      }
      .card:hover {
        --bs-bg-opacity: 1;
        background-color: rgba(
          var(--bs-info-rgb),
          var(--bs-bg-opacity)
        ) !important;
      }
      .kartuMengecil {
        transform: scale(0.7, 0.7);
      }
      .kartuMembesar {
        transform: scale(1.2, 1.2);
      }
    </style>
  </head>
  <body>
    <section class="min-vh-100 d-flex align-items-center">
      <div class="container text-center" data-aos="fade-up">
        <div class="row justify-content-around">
          <div
            class="card mt-5"
            style="width: 18rem; transition: 0.5s"
            id="Batu"
          >
            <a
              href="#"
              class="btn"
              role="button"
              onclick="playerMilihKartu('Batu')"
            >
              <img src="batu.gif" alt="Batu" class="card-img-top" />
              <div class="card-body">
                <h5 class="card-title">Batu</h5>
              </div>
            </a>
          </div>

          <div
            class="card mt-5"
            style="width: 18rem; transition: 0.5s"
            id="Gunting"
          >
            <a
              href="#"
              class="btn"
              role="button"
              onclick="playerMilihKartu('Gunting')"
            >
              <img src="gunting.gif" alt="Gunting" class="card-img-top" />
              <div class="card-body">
                <h5 class="card-title">Gunting</h5>
              </div>
            </a>
          </div>

          <div
            class="card mt-5"
            style="width: 18rem; transition: 0.5s"
            id="Kertas"
          >
            <a
              href="#"
              class="btn"
              role="button"
              onclick="playerMilihKartu('Kertas')"
            >
              <img src="kertas.gif" alt="Kertas" class="card-img-top" />
              <div class="card-body">
                <h5 class="card-title">Kertas</h5>
              </div>
            </a>
          </div>

          <div
            class="card mt-5 d-none"
            style="width: 18rem; transition: 0.5s"
            id="vs"
          >
            <img src="../suten-hewan/vs.gif" alt="vs" class="card-img" />
          </div>

          <div
            class="card mt-5 d-none"
            style="width: 18rem; transition: 0.5s"
            id="ai"
          >
            <div
              class="spinner-border m-auto mt-5 mb-5 d-none"
              role="status"
              id="loadingDulu"
            >
              <span class="visually-hidden">Loading...</span>
            </div>

            <div class="card-body d-none" id="aiMilihKertas">
              <img src="kertas.gif" alt="Kertas" class="card-img-top" />
              <h5 class="card-title">Kertas</h5>
            </div>

            <div class="card-body d-none" id="aiMilihGunting">
              <img src="gunting.gif" alt="Gunting" class="card-img-top" />
              <h5 class="card-title">Gunting</h5>
            </div>

            <div class="card-body d-none" id="aiMilihBatu">
              <img src="batu.gif" alt="Batu" class="card-img-top" />
              <h5 class="card-title">Batu</h5>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script>
      AOS.init();
    </script>
  </body>
</html>
