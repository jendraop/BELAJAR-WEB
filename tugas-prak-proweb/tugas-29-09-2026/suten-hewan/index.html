<!doctype html>
<html lang="id">
  <head>
    <title>Suit</title>
    <link rel="stylesheet" href="../bootstrap.css" />
    <link rel="stylesheet" href="../aos.css" />
    <script src="../bootstrap.js"></script>
    <script src="../aos.js"></script>
    <style>
      @font-face {
        font-family: "web";
        src: url(../../../alat-bantu/fonts/JetBrains_Mono/static/JetBrainsMono-Regular.ttf);
      }
      * {
        font-family: web;
      }
      body {
        background-image: url(../edited-photo.jpg);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        min-height: 100vh;
        min-width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="min-vh-100 d-flex align-items-center">
      <div class="container text-center">
        <div class="bg-secondary text-white">
          <h1 class="text-center text-uppercase fw-bold">
            silahkan pilih mau pakai yang mana
          </h1>
        </div>
        <div class="row justify-content-around">
          <div class="col">
            <div class="card h-100">
              <img
                src="../suit-hewan.gif"
                alt="gif gajah"
                class="card-img-top"
                style="height: 200px; object-fit: cover"
              />
              <div class="card-body">
                <a href="#" class="btn btn-primary">Gajah</a>
              </div>
            </div>
          </div>

          <div class="col">
            <div class="card h-100">
              <img
                src="semut.gif"
                alt="gif semut"
                class="card-img-top"
                style="height: 200px; object-fit: cover"
              />
              <div class="card-body">
                <a href="#" class="btn btn-primary">Semut</a>
              </div>
            </div>
          </div>

          <div class="col">
            <div class="card h-100">
              <img
                src="human.gif"
                alt="gif manusia"
                class="card-img-top"
                style="height: 200px; object-fit: cover"
              />
              <div class="card-body">
                <a href="#" class="btn btn-primary">Manusia/Orang</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
