<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <fieldset>
      <legend>Akun</legend>
      <label for="Username">Username</label>
      <input type="text" name="Username" id="Username" />
      <br />
      <label for="password">password</label>
      <input type="password" name="password" id="password" />
      <br />
      <label for="Konfirmasi password">Konfirmasi password</label>
      <input
        type="password"
        name="Konfirmasi password"
        id="Konfirmasi password"
      />
      <br />
    </fieldset>
    <fieldset>
      <legend>Data</legend>
      <label for="Nama">Nama</label>
      <input type="text" name="Nama" id="Nama" />
      <br />
      <p>Jenis Kelamin</p>
      <input type="radio" name="gender+" id="Pria" />
      <label for="Pria">Pria</label>
      <input type="radio" name="gender" id="Wanita" />
      <label for="Wanita">Wanita</label>

      <p>Informasi yang disukai</p>
      <input type="checkbox" name="olahraga" id="olahraga" />
      <label for="olahraga">olahraga</label>
      <input type="checkbox" name="travelling" id="travelling" />
      <label for="travelling">travelling</label>
      <input type="checkbox" name="kesehatan" id="kesehatan" />
      <label for="kesehatan">kesehatan</label>
    </fieldset>

    <button type="submit" name="Daftar">Daftar</button>
    <button type="reset" name="Reset">Reset</button>
  </body>
</html>
