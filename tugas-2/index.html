<!doctype html>
<html lang="in">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form
      action="https://script.google.com/macros/s/AKfycbxC8HJaZ7gS5aYW6pbY-74SEClXPLWt3SM90vNYPYUoJjkbcbaUxWV74GegqpSbyX3nqg/exec"
      method="post"
    >
      <br />
      <!-- input text -->
      Nama :
      <input
        type="text"
        name="namaUser"
        id="namaUser"
        placeholder="masukkan nama kamu"
        required
      />
      <br />
      <br />

      <!-- password input -->
      password :
      <input
        type="password"
        name="sandi"
        id="sandi"
        placeholder="minimal 6 karakter"
        required
      />
      <br />
      <br />

      <!-- text area  -->
      Komen :
      <textarea
        name="komentar"
        id="komentar"
        placeholder="komentarnya opsional aja"
      ></textarea>
      <br />
      <br />

      <!-- radio button -->
      Jenis Kelamin <br />
      <input
        type="radio"
        name="jenis kelamin"
        id="laki-laki"
        value="laki-laki"
      />
      <label for="laki-laki">laki laki</label><br />
      <input
        type="radio"
        name="jenis kelamin"
        id="perempuand"
        value="perempuan"
      />
      <label for="perempuan">perempuan</label><br />
      <br />

      <!-- checkbox -->
      Hobi <br />
      <input type="checkbox" name="Hobi" id="Belajar" value="Belajar" />
      <label for="Belajar">Belajar</label><br />
      <input type="checkbox" name="Hobi" id="Lari" value="Lari" />
      <label for="Lari">Lari</label><br />
      <input type="checkbox" name="Hobi" id="Membaca" value="Membaca" />
      <label for="Membaca">Membaca</label><br />
      <input type="checkbox" name="Hobi" id="Berenang" value="Berenang" />
      <label for="Berenang">Berenang</label><br /><br />

      <!-- select option -->
      Semester :
      <select name="semester" id="semester">
        <option value="semester-1">semester 1</option>
        <option value="semester-2">semester 2</option>
        <option value="semester-3">semester 3</option>
        <option value="semester-4">semester 4</option>
        <option value="semester-5">semester 5</option>
        <option value="semester-6">semester 6</option>
        <option value="semester-7">semester 7</option>
        <option value="semester-8">semester 8</option>
        <option value="sepuh">sepuh</option></select
      ><br /><br />
      <!-- submit -->
      <input type="submit" name="masukkan" id="tombol" />
    </form>
  </body>
</html>
